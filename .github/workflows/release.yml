name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Required for cosign keyless signing via GitHub OIDC
  id-token: write
  # Required to push the container image to ghcr.io
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # goreleaser cross-compiles the arm64 binary itself, but building an
      # arm64 image on an amd64 runner needs buildx.
      - name: Set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A separate fine-grained PAT, because GITHUB_TOKEN is scoped to this
          # repository and the formula has to be committed to kanywst/homebrew-tap.
          # Scope it to `contents: write` on that tap and nothing else.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Called rather than triggered. `release: published` looks like the natural
  # trigger and never fires: goreleaser creates the release with GITHUB_TOKEN,
  # and GitHub does not start workflows from a GITHUB_TOKEN action. Calling the
  # workflow keeps the listing in the same run as the image it points at.
  publish-registry:
    needs: release
    uses: ./.github/workflows/publish-mcp-registry.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
