version: 2

project_name: mcp-opa-authz

before:
  hooks:
    # `verify` checks checksums without mutating go.mod / go.sum, so a
    # release stays bit-reproducible. CI / dev should run `go mod tidy`.
    - go mod verify

builds:
  - id: mcp-opa-authz
    binary: mcp-opa-authz
    main: ./
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}-{{ .Version }}-checksums.txt"

# The official MCP registry does not accept a bare GitHub Releases binary as a
# distribution channel, and there is no Go package type. An OCI image is the
# channel that works, and it is also what MCP clients that launch servers with
# `docker run` want. See server.json.
dockers_v2:
  - images:
      - "ghcr.io/kanywst/{{ .ProjectName }}"
    tags:
      - "{{ .Version }}"
      - "latest"
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

release:
  prerelease: auto

# Formula rather than Cask, to match `spiffe-compliance-checker` — the other Go
# CLI in the tap, built and installed the same way. The tap's readme is explicit
# that the split is not a CLI/GUI distinction but simply which GoReleaser block
# wrote the file, so consistency with its sibling is the whole of the argument.
#
# It is specifically not that a Cask could not serve linux. Homebrew 6 does
# install casks on linux — `Cask::Installer#check_stanza_os_requirements` only
# refuses one that declares `depends_on macos:`, which the tap's `y509` and
# `brtc` casks do not. Both are installable on either platform.
#
# GoReleaser marks `brews:` deprecated in favour of `homebrew_casks:`. That is
# bounded rather than urgent — deprecated options are removed "only on major
# versions" — and `spiffe-compliance-checker` uses the same block in the same
# tap for the same reason. Revisit if the two ever need to diverge.
brews:
  - name: mcp-opa-authz
    repository:
      owner: kanywst
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/kanywst/mcp-opa-authz
    # Homebrew caps a formula description at 80 characters, which is shorter
    # than the repository description this was taken from. `brew style` rejects
    # the formula otherwise, and nothing in the release run would catch it.
    description: "Answer agent authorization questions with OPA Rego or an AuthZEN PDP"
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore(mcp-opa-authz): bump to {{ .Tag }}"
    directory: Formula
    install: |
      bin.install "mcp-opa-authz"
    test: |
      system "#{bin}/mcp-opa-authz", "--version"

sboms:
  - artifacts: archive

# cosign 3.x (installed by cosign-installer v4) defaults to the Sigstore
# bundle format and ignores --output-certificate / --output-signature, so the
# signature and the certificate ship together in one .sigstore.json instead of
# a separate .sig + .pem pair.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
