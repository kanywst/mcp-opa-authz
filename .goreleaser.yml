version: 2

project_name: mcp-opa-authz

before:
  hooks:
    # `verify` checks checksums without mutating go.mod / go.sum, so a
    # release stays bit-reproducible. CI / dev should run `go mod tidy`.
    - go mod verify

builds:
  - id: mcp-opa-authz
    binary: mcp-opa-authz
    main: ./
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}-{{ .Version }}-checksums.txt"

# The official MCP registry does not accept a bare GitHub Releases binary as a
# distribution channel, and there is no Go package type. An OCI image is the
# channel that works, and it is also what MCP clients that launch servers with
# `docker run` want. See server.json.
dockers_v2:
  - images:
      - "ghcr.io/kanywst/{{ .ProjectName }}"
    tags:
      - "{{ .Version }}"
      - "latest"
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

release:
  prerelease: auto

# Formula rather than Cask. The tap's readme is explicit that the split is not
# a CLI/GUI distinction but simply which GoReleaser block wrote the file, and a
# Cask would be the wrong one here for a concrete reason: Homebrew supports
# casks on macOS only, so the linux/amd64 and linux/arm64 archives this build
# already produces would have no way to be installed. `brews:` writes a Formula,
# which works on both.
#
# GoReleaser marks `brews:` deprecated in favour of `homebrew_casks:`. That is
# bounded rather than urgent — deprecated options are removed "only on major
# versions" — and `spiffe-compliance-checker` uses the same block in the same
# tap for the same reason. Revisit if the two ever need to diverge.
brews:
  - name: mcp-opa-authz
    repository:
      owner: kanywst
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/kanywst/mcp-opa-authz
    description: "MCP server giving LLM agents real authorization answers: evaluate Rego in-process via OPA, or ask an OpenID AuthZEN 1.0 PDP"
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore(mcp-opa-authz): bump to {{ .Tag }}"
    directory: Formula
    install: |
      bin.install "mcp-opa-authz"
    test: |
      system "#{bin}/mcp-opa-authz", "--version"

sboms:
  - artifacts: archive

# cosign 3.x (installed by cosign-installer v4) defaults to the Sigstore
# bundle format and ignores --output-certificate / --output-signature, so the
# signature and the certificate ship together in one .sigstore.json instead of
# a separate .sig + .pem pair.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
